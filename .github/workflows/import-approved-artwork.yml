name: Import approved shop artwork
on:
  push:
    branches: [design/yellow-repair-20261020]
    paths: [.github/workflows/import-approved-artwork.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Import the approved artwork through an encrypted transfer
        env:
          ARTWORK_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 - <<'ARTWORK_PY'
          import base64, hashlib, json, os, pathlib, secrets, struct, subprocess, tempfile, time, urllib.error, urllib.parse, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["GITHUB_REF_NAME"]
          token = os.environ["ARTWORK_REPO_TOKEN"]
          public_path = ".github/artwork-transfer-public.json"
          encrypted_path = ".github/artwork-transfer.json"
          asset_path = "assets/mosgame-showcase.png"
          api_base = "https://api.github.com/repos/" + repo
          
          def api(method, suffix, body=None):
              encoded = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(api_base + suffix, data=encoded, method=method, headers={"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "Content-Type": "application/json", "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(req, timeout=40) as response:
                  return json.load(response)
          
          def commit_entries(entries, message):
              ref = api("GET", "/git/ref/heads/" + urllib.parse.quote(branch, safe="/"))
              parent = ref["object"]["sha"]
              commit = api("GET", "/git/commits/" + parent)
              tree = api("POST", "/git/trees", {"base_tree": commit["tree"]["sha"], "tree": entries})
              saved = api("POST", "/git/commits", {"message": message, "tree": tree["sha"], "parents": [parent]})
              api("PATCH", "/git/refs/heads/" + urllib.parse.quote(branch, safe="/"), {"sha": saved["sha"], "force": False})
              return saved["sha"]
          
          def put_blob(raw):
              return api("POST", "/git/blobs", {"encoding": "base64", "content": base64.b64encode(raw).decode()})["sha"]
          
          with tempfile.TemporaryDirectory(prefix="approved-artwork-") as directory:
              root = pathlib.Path(directory)
              key = root / "private.pem"
              subprocess.run(["openssl", "genpkey", "-algorithm", "RSA", "-pkeyopt", "rsa_keygen_bits:3072", "-out", str(key)], check=True, capture_output=True)
              key.chmod(0o600)
              modulus = subprocess.run(["openssl", "rsa", "-in", str(key), "-noout", "-modulus"], check=True, capture_output=True, text=True).stdout.strip().split("=", 1)[1]
              nonce = secrets.token_hex(16)
              public = json.dumps({"modulus": modulus, "exponent": 65537, "nonce": nonce}).encode()
              commit_entries([{"path": public_path, "mode": "100644", "type": "blob", "sha": put_blob(public)}], "Prepare encrypted transfer of approved artwork")
              print("Ready to receive the encrypted artwork transfer.", flush=True)
              payload = None
              deadline = time.monotonic() + 600
              while time.monotonic() < deadline:
                  try:
                      found = api("GET", "/contents/" + encrypted_path + "?ref=" + urllib.parse.quote(branch, safe=""))
                      envelope = json.loads(base64.b64decode(found["content"]))
                      if envelope.get("nonce") == nonce:
                          payload = envelope
                          break
                  except urllib.error.HTTPError as exc:
                      if exc.code != 404:
                          raise
                  time.sleep(5)
              if payload is None:
                  raise RuntimeError("Encrypted artwork transfer was not received.")
              chunks = []
              for encoded in payload["chunks"]:
                  decoded = subprocess.run(["openssl", "pkeyutl", "-decrypt", "-inkey", str(key), "-pkeyopt", "rsa_padding_mode:oaep", "-pkeyopt", "rsa_oaep_md:sha256", "-pkeyopt", "rsa_mgf1_md:sha256"], input=base64.b64decode(encoded), capture_output=True)
                  if decoded.returncode != 0:
                      raise RuntimeError("Encrypted artwork transfer validation failed.")
                  chunks.append(decoded.stdout)
              transfer = json.loads(b"".join(chunks))
              if transfer.get("library_file_id") != "libfile_5d6b197e5fac819188dd7251924e8b2b":
                  raise RuntimeError("Unexpected artwork identity.")
              for name, encoded in {"library_file_transfer.py":"","library_hosted_apps.py":""}.items():
                  (root / name).write_bytes(base64.b64decode(encoded))
              image_path = root / "approved-showcase.png"
              materialized = subprocess.run(["python3", str(root / "library_file_transfer.py"), "materialize", str(image_path)], input=json.dumps(transfer).encode(), capture_output=True)
              if materialized.returncode != 0:
                  raise RuntimeError("The approved artwork could not be materialized.")
              raw = image_path.read_bytes()
              if len(raw) != 2244135 or raw[:8] != b"\x89PNG\r\n\x1a\n" or struct.unpack(">II", raw[16:24]) != (1672, 941):
                  raise RuntimeError("The approved artwork has unexpected bytes or dimensions.")
              image_sha = put_blob(raw)
              result = commit_entries([{"path": asset_path, "mode": "100644", "type": "blob", "sha": image_sha},{"path": public_path, "mode": "100644", "type": "blob", "sha": None},{"path": encrypted_path, "mode": "100644", "type": "blob", "sha": None}], "Add approved yellow console repair artwork")
              print("Approved artwork imported. SHA-256: " + hashlib.sha256(raw).hexdigest(), flush=True)
              print("Artwork commit: " + result, flush=True)
          ARTWORK_PY
