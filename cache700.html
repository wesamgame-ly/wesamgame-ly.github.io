<!doctype html><html lang="ar" dir="rtl" manifest="700.manifest"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080909"><meta name="site-version" content="mosgame-jailbreak-v3.2"><title>تثبيت ملفات التشغيل | الموسوعة الإلكترونية</title><meta name="description" content="الموسوعة الإلكترونية — صفحة تشغيل جولدهن لبلايستيشن 4. نفس ملفات التشغيل الأصلية، بتصميم عربي."><link rel="icon" href="assets/mosgame-mark.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/mosgame.css"></head><body class="setup-page"><div class="game-backdrop" aria-hidden="true"></div><div class="host-page"><header class="site-header"><a class="wordmark" href="./" aria-label="الموسوعة الإلكترونية — الرئيسية"><span class="brand-symbol" aria-hidden="true">△ ○ × □</span><span>الموسوعة الإلكترونية</span></a><span class="header-label">مضيف بلايستيشن 4 <i></i></span></header><main class="setup-main"><div class="setup-identity"><span class="host-label">الموسوعة الإلكترونية</span><h1>تجهيز ملفات جهازك</h1><p class="setup-tag">بلايستيشن 4 <bdi>7.00–8.52</bdi></p></div><section class="launch-panel setup-panel" aria-labelledby="setup-title"><h2 id="setup-title">التثبيت دون اتصال</h2><p id="msgs" role="status" aria-live="polite">جارٍ بدء حفظ الملفات…</p><div class="track" aria-hidden="true"><div id="bar"></div></div><div class="progress-meta"><span>ملفات التشغيل</span><bdi id="percent">0%</bdi></div><button class="run" id="go" type="button" disabled>جارٍ التثبيت…</button><p class="launch-hint">أبقِ الصفحة مفتوحة والإنترنت متصلًا حتى اكتمال التثبيت.</p></section></main><footer class="site-footer"><span>طرابلس، شارع الكندي أمام فندق السفير</span><a href="tel:0926590450" aria-label="اتصل بالموسوعة الإلكترونية على 0926590450"><span aria-hidden="true">☎</span> <b dir="ltr">0926590450</b></a></footer></div><script>
  (function(){
    var msgs=document.getElementById("msgs"),bar=document.getElementById("bar"),percent=document.getElementById("percent"),go=document.getElementById("go"),ac=window.applicationCache,finished=false;
    try{history.replaceState(null,null,"index.html")}catch(e){}
    function progress(e){var p=e&&e.total?Math.round(e.loaded/e.total*100):0;if(p>0){bar.style.width=p+"%";percent.textContent=p+"%";msgs.textContent="جارٍ حفظ ملفات التشغيل…"}}
    function done(){if(finished)return;finished=true;try{if(ac.status===ac.UPDATEREADY)ac.swapCache()}catch(e){}try{localStorage.setItem("multifw-cache-v2","1")}catch(e){}bar.style.width="100%";percent.textContent="100%";msgs.textContent="تم حفظ الملفات بنجاح — يمكنك الآن تشغيل جولدهن";msgs.className="ok";go.disabled=false;go.textContent="العودة إلى التشغيل"}
    function failed(){msgs.textContent="تعذر تثبيت الملفات. امسح بيانات متصفح بلايستيشن 4 ثم أعد المحاولة.";msgs.className="bad";go.disabled=false;go.textContent="إعادة المحاولة";go.onclick=function(){location.reload()}}
    go.onclick=function(){location.replace("index.html")};
    if(!ac){failed();return}ac.addEventListener("progress",progress,false);ac.addEventListener("cached",done,false);ac.addEventListener("updateready",done,false);ac.addEventListener("noupdate",done,false);ac.addEventListener("error",failed,false);
    setTimeout(function(){if(ac.status===ac.IDLE||ac.status===ac.UPDATEREADY)done()},700);
  })();
  </script></body></html>
